<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kush Chronic | Premium Dispensary</title>
    <style>
        :root {
            --bg-color: #0c0f0c;
            --text-color: #f0f4f0;
            --accent-color: #2ecc71;
            --card-bg: #161b16;
            --border-color: #253025;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background-color: #111611;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .cart-icon {
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            background: var(--accent-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
        }

        .category-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px auto 10px;
            max-width: 1200px;
            padding: 0 20px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto 40px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .category-nav {
                flex-wrap: wrap;
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .product-image {
            width: 100%;
            height: 160px;
            background-color: #1e251e;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }

        .product-card h3 {
            margin: 10px 0 5px;
            font-size: 18px;
        }

        .product-desc {
            font-size: 13px;
            color: #aaa;
            margin: 0 0 12px 0;
            min-height: 34px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        .btn-add {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-add:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        .sidebar-cart {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-cart h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .cart-items {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .cart-item button {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .payment-methods-box {
            margin: 15px 0;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .payment-methods-box label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .payment-methods-box input[type="radio"] {
            margin-right: 8px;
            accent-color: var(--accent-color);
        }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .btn-checkout {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-checkout:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            opacity: 1;
        }

        /* --- POPUPS & SCROLLABLE MODALS --- */
        .checkout-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start; 
            overflow-y: auto;        
            padding: 20px 0;
        }

        .modal-content {
            background-color: #111;
            width: 95%;
            max-width: 700px; 
            height: 90vh; 
            margin-top: 10px;        
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
        }

        .weight-modal-size {
            max-width: 450px;
            height: auto;
            max-height: 85vh;
        }

        .modal-header {
            background-color: #161b16;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .modal-header h3 {
            margin: 0;
            color: var(--text-color);
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: #ff5252;
        }

        .iframe-wrapper {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;        
            -webkit-overflow-scrolling: touch;
        }

        .checkout-iframe {
            width: 100%;
            height: 100%;
            min-height: 750px;       
            border: none;
            background-color: #111411; 
        }

        .formspree-body {
            padding: 30px;
            overflow-y: auto;
            color: #fff;
        }

        .formspree-body label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .formspree-body input, .formspree-body textarea {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .formspree-body textarea {
            height: 100px;
            resize: none;
        }

        .btn-submit-order {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* --- WEIGHT VARIATION SELECTION UI --- */
        .weight-selector-body {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .weight-option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c221c;
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .weight-option-row:hover:not(.disabled-row) {
            border-color: var(--accent-color);
            background: #222a22;
        }

        .weight-option-row input[type="radio"] {
            accent-color: var(--accent-color);
            transform: scale(1.2);
            cursor: pointer;
        }

        .disabled-row {
            opacity: 0.35;
            cursor: not-allowed;
            background: #111;
        }

        .out-of-stock-badge {
            color: #ff5252;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            border: 1px solid #ff5252;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

            <button class="btn-checkout" id="main-checkout-btn" onclick="handleCheckout()">Complete Purchase</button>

    </div>

    <div class="checkout-overlay" id="weight-window-overlay">

            <div class="iframe-wrapper">

            </div>
        </div>
    </div>

    <div class="checkout-overlay" id="formspree-window-overlay">
        <div class="modal-content">

            </form>

            { id: 20, category: "vapes", name: "The orange one cartridge live resin 1g", price: 45.00, desc: "Spicy herbal notes built for pure relaxation.", img: "https://images.dutchie.com/04c2e1f8a50cf43fd7bbc32ebeae7615?auto=format%2Ccompress&cs=srgb&fit=fill&fill=solid&fillColor=%23fff&w=787.5&dpr=1&ixlib=react-9.8.1" }
        ];

        let cart = [];
        let currentFilter = 'all';
        let activeFlowerProduct = null;

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';
            const filtered = products.filter(p => currentFilter === 'all' || p.category === currentFilter);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                const imgElement = p.img 
                    ? `<img src="${p.img}" class="product-image" alt="${p.name}">` 
                    : `<div class="product-image">[ Image Pending ]</div>`;

                const priceDisplay = p.category === 'flower' 
                    ? `$${p.variations[0].price.toFixed(2)} - $${p.variations[p.variations.length - 1].price.toFixed(2)}`
                    : `$${p.price.toFixed(2)}`;

                card.innerHTML = `
                    <div>
                        ${imgElement}
                        <h3>${p.name}</h3>
                        <p class="product-desc">${p.desc}</p>
                    </div>
                    <div>
                        <div class="product-price">${priceDisplay}</div>
                        <button class="btn-add" onclick="handleAddToCartClick(${p.id})">Add to Cart</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(category, element) {
            currentFilter = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            renderCatalog();
        }

        function handleAddToCartClick(id) {
            const product = products.find(p => p.id === id);
            if (product.category === 'flower') {
                openWeightModal(product);
            } else {
                executeAddtoCartState(product.id, product.name, product.price);
            }
        }

        function openWeightModal(product) {
            activeFlowerProduct = product;
            document.getElementById('weight-modal-title').innerText = `Select Weight: ${product.name}`;
            
            const optionsContainer = document.getElementById('weight-options-container');
            optionsContainer.innerHTML = '';

            product.variations.forEach((v, index) => {
                const row = document.createElement('label');
                row.className = `weight-option-row ${!v.inStock ? 'disabled-row' : ''}`;
                
                const inputState = v.inStock ? '' : 'disabled';
                const badgeElement = v.inStock ? '' : `<span class="out-of-stock-badge">Sold Out</span>`;

                row.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <input type="radio" name="flowerWeight" value="${index}" ${inputState} ${v.inStock && index === 0 ? 'checked' : ''}>
                        <span><strong>${v.label}</strong></span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span>$${v.price.toFixed(2)}</span>
                        ${badgeElement}
                    </div>
                `;
                optionsContainer.appendChild(row);
            });

            document.getElementById('weight-window-overlay').style.display = 'flex';
        }

        function confirmWeightAdd() {
            const selectedRadio = document.querySelector('input[name="flowerWeight"]:checked');
            if (!selectedRadio) {
                alert("Please select an available option.");
                return;
            }

            const variationIndex = parseInt(selectedRadio.value);
            const variation = activeFlowerProduct.variations[variationIndex];
            const extendedCartName = `${activeFlowerProduct.name} (${variation.label})`;
            const compoundId = `${activeFlowerProduct.id}-${variationIndex}`;

            executeAddtoCartState(compoundId, extendedCartName, variation.price);
            closeOverlayWindow('weight-window-overlay');
        }

        function executeAddtoCartState(cartId, name, price) {
            const existingItem = cart.find(item => item.id === cartId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id: cartId, name: name, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function calculateTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
        }

        function updateCartUI() {
            const listElement = document.getElementById('cart-items-list');
            const countElement = document.getElementById('cart-count');
            const totalElement = document.getElementById('cart-total-amount');

            listElement.innerHTML = '';
            let totalItems = 0;

            cart.forEach(item => {
                totalItems += item.quantity;
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <div>
                        <strong>${item.name}</strong> x${item.quantity}<br>
                        <small>$${(item.price * item.quantity).toFixed(2)}</small>
                    </div>
                    <button onclick="removeFromCart('${item.id}')">×</button>
                `;
                listElement.appendChild(li);
            });

            countElement.innerText = totalItems;
            totalElement.innerText = `$${calculateTotal()}`;
        }

        function getCartManifestText() {
            return cart.map(item => `${item.name} (Qty: ${item.quantity}) - $${(item.price * item.quantity).toFixed(2)}`).join('\n');
        }

        function handleCheckout() {
            const finalAmount = calculateTotal();
            const checkoutButton = document.getElementById('main-checkout-btn');

            if (parseFloat(finalAmount) <= 0) {
                alert("Please add items to your cart before checking out.");
                return;
            }

            const selectedMethod = document.querySelector('input[name="payMethod"]:checked').value;

            if (selectedMethod === 'online') {
                checkoutButton.innerText = "Processing Order Tracking...";
                checkoutButton.disabled = true;

                fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: "new potential orders came", 
                        manifest: getCartManifestText(),
                        total: `$${finalAmount}`,
                        paymentMethod: "E-Transfer / Crypto"
                    })
                })
                .then(() => {
                    checkoutButton.innerText = "Complete Purchase";
                    checkoutButton.disabled = false;

                    const baseUrl = "https://flashgroweb.github.io/pos/onlpay.html";
                    const targetUrl = `${baseUrl}?amt=${finalAmount}&id=2`;

                    const overlay = document.getElementById('iframe-window-overlay');
                    const iframe = document.getElementById('checkout-frame');

                    iframe.src = targetUrl;
                    overlay.style.display = 'flex';
                })
                .catch(err => {
                    console.error("Tracking Error: ", err);
                    checkoutButton.innerText = "Complete Purchase";
                    checkoutButton.disabled = false;
                    
                    alert("Order log network delay. Loading payment portal anyway...");
                    const baseUrl = "https://flashgroweb.github.io/pos/onlpay.html";
                    document.getElementById('checkout-frame').src = `${baseUrl}?amt=${finalAmount}&id=1`;
                    document.getElementById('iframe-window-overlay').style.display = 'flex';
                });

            } else {
                document.getElementById('hidden-total').value = `$${finalAmount}`;
                document.getElementById('cust-manifest').value = getCartManifestText() + `\n\nGrand Total: $${finalAmount}`;
                document.getElementById('formspree-window-overlay').style.display = 'flex';
            }
        }

        function closeOverlayWindow(overlayId) {
            const overlay = document.getElementById(overlayId);
            overlay.style.display = 'none';
            
            if (overlayId === 'iframe-window-overlay') {
                document.getElementById('checkout-frame').src = 'about:blank';
            }
        }

        // Run UI Initialization on execution load
        renderCatalog();
    </script>
